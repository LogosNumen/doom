<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⌈Ｓｃｏｐｅ⌋</title>
<link rel="icon" type="image/gif" sizes="32x32" href="../img/favicon32.gif">
<link rel="icon" type="image/gif" sizes="16x16" href="../img/favicon.gif">
<link rel="stylesheet" href="../css/chrome.css">

<style>
* { margin:0; padding:0; box-sizing:border-box; image-rendering:pixelated;
    -webkit-font-smoothing:none; font-smooth:never; }
html, body { height:100%; }
body { background:#000; color:#c8c3b4; overflow:hidden;
       font:10px/1.7 "MS Gothic","Osaka-Mono","Courier New",monospace;
       display:flex; flex-direction:column; align-items:center;
       justify-content:center; gap:12px; padding:16px; }

#c { width:min(78vh, 92vw); height:min(78vh, 92vw); display:block;
     border:1px solid #1c1a17; touch-action:none; cursor:crosshair; }

.read { letter-spacing:.34em; color:#6b675e; text-align:center; }
.read b { color:#c8c3b4; font-weight:normal; }
.read .lock { color:#b4503c; }

.bar { display:flex; gap:16px; align-items:center; letter-spacing:.3em; }
button { background:#000; color:#c8c3b4; border:1px solid #1c1a17;
         font:10px/1 "MS Gothic","Courier New",monospace; letter-spacing:.3em;
         padding:7px 12px; cursor:pointer; }
button:hover { color:#b4503c; border-color:#6b675e; }
button[aria-pressed="true"] { color:#b4503c; border-color:#b4503c; }
a { color:#c8c3b4; text-decoration:none; letter-spacing:.4em; }
a:hover, a:focus { color:#b4503c; }
:focus-visible { outline:1px dotted #c8c3b4; outline-offset:3px; }

body::after {
  content:""; position:fixed; inset:0; pointer-events:none; z-index:9000;
  background:repeating-linear-gradient(to bottom,
    rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 2px, rgba(0,0,0,.22) 3px);
}
@media (max-width:520px) { .bar { flex-wrap:wrap; justify-content:center; } }
</style>
</head>
<body data-amb="empty">

<canvas id="c" width="256" height="256"
        aria-label="An oscilloscope tracing a Lissajous figure. Moving the pointer changes the ratio between the two axes."></canvas>

<p class="read">
  Ｘ <b id="rx">2</b> ： Ｙ <b id="ry">3</b> &nbsp;·&nbsp;
  ｐｈａｓｅ <b id="rp">0.00</b> &nbsp;·&nbsp;
  <span id="lock">&nbsp;</span>
</p>

<p class="bar">
  <button id="tone" type="button" aria-pressed="false">ＴＯＮＥＳ</button>
  <a href="../dir.html">[ dir ]</a>
  <a href="../index.html">[ back ]</a>
</p>

<script src="../js/backdrop.js?v=bc628881"></script>
<script src="../js/sound.js?v=2e7444a2"></script>
<script src="../js/figure.js?v=4b7e2f35"></script>
<script>
(function () {
  "use strict";

  var c = document.getElementById("c");
  var ctx = c.getContext("2d", { alpha: false });
  var W = c.width, H = c.height;
  var reduced =
    window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Phosphor is kept as a float buffer that decays every frame, then quantised
     through an ordered dither on the way to the screen -- so the trail bands
     the way a cheap long-persistence tube bands, instead of fading smoothly. */
  var buf = new Float32Array(W * H);
  var img = ctx.createImageData(W, H);

  var BAYER = (function () {
    var m = [[0]], size = 1;
    while (size < 8) {
      var n = [], s2 = size * 2;
      for (var y = 0; y < s2; y++) {
        n[y] = [];
        for (var x = 0; x < s2; x++) {
          var q = m[y % size][x % size] * 4;
          n[y][x] = q + (y < size ? (x < size ? 0 : 2) : (x < size ? 3 : 1));
        }
      }
      m = n; size = s2;
    }
    for (var y2 = 0; y2 < 8; y2++)
      for (var x2 = 0; x2 < 8; x2++) m[y2][x2] /= 64;
    return m;
  })();

  var R = [0x00, 0x1c, 0x6b, 0xc8],
      G = [0x00, 0x1a, 0x67, 0xc3],
      B = [0x00, 0x17, 0x5e, 0xb4];

  /* ---- controls ---------------------------------------------------- */

  var nx = 2, ny = 3, phase = 0, target = 0;

  function fromPointer(px, py) {
    var r = c.getBoundingClientRect();
    var u = Math.min(1, Math.max(0, (px - r.left) / r.width));
    var v = Math.min(1, Math.max(0, (py - r.top) / r.height));
    nx = 1 + Math.round(u * 8);
    ny = 1 + Math.round(v * 8);
    target = v * Math.PI;      // the vertical axis also walks the phase
    paint();
  }

  function gcd(a, b) { return b ? gcd(b, a % b) : a; }

  function paint() {
    document.getElementById("rx").textContent = nx;
    document.getElementById("ry").textContent = ny;
    document.getElementById("rp").textContent = phase.toFixed(2);
    var l = document.getElementById("lock");
    /* A figure stands still only when the two frequencies are a small whole
       ratio. Everything else drifts forever, which is most of the dial. */
    var g = gcd(nx, ny);
    var simple = (nx / g) <= 5 && (ny / g) <= 5;
    l.textContent = simple ? "ＬＯＣＫＥＤ　" + (nx / g) + "：" + (ny / g) : "ｄｒｉｆｔｉｎｇ";
    l.className = simple ? "lock" : "";
    if (window.__scopeTone) window.__scopeTone();
  }

  c.addEventListener("pointermove", function (e) { fromPointer(e.clientX, e.clientY); });
  c.addEventListener("pointerdown", function (e) { fromPointer(e.clientX, e.clientY); });
  c.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowRight") nx = Math.min(9, nx + 1);
    else if (k === "ArrowLeft") nx = Math.max(1, nx - 1);
    else if (k === "ArrowUp") ny = Math.max(1, ny - 1);
    else if (k === "ArrowDown") ny = Math.min(9, ny + 1);
    else return;
    e.preventDefault();
    paint();
  });
  c.tabIndex = 0;

  /* ---- the trace --------------------------------------------------- */

  var t = 0;

  function step() {
    phase += (target - phase) * 0.04;

    // decay the whole tube a little
    for (var i = 0; i < buf.length; i++) buf[i] *= 0.90;

    // lay down one short arc of the figure per frame
    var seg = 260;
    for (var s = 0; s < seg; s++) {
      var u = t + s * 0.0016;
      var x = Math.sin(u * nx * Math.PI * 2 + phase);
      var y = Math.sin(u * ny * Math.PI * 2);
      var px = Math.round((x * 0.44 + 0.5) * W);
      var py = Math.round((y * 0.44 + 0.5) * H);
      if (px >= 0 && px < W && py >= 0 && py < H) {
        var k = py * W + px;
        buf[k] = Math.min(1.6, buf[k] + 0.55);
        // a soft halo, so the beam has some width
        if (px > 0) buf[k - 1] = Math.min(1.2, buf[k - 1] + 0.13);
        if (px < W - 1) buf[k + 1] = Math.min(1.2, buf[k + 1] + 0.13);
        if (py > 0) buf[k - W] = Math.min(1.2, buf[k - W] + 0.13);
        if (py < H - 1) buf[k + W] = Math.min(1.2, buf[k + W] + 0.13);
      }
    }
    t += 0.0016 * seg;

    // quantise through the ordered dither
    var d = img.data;
    for (var y2 = 0, i2 = 0, p = 0; y2 < H; y2++) {
      var scan = (y2 & 1) ? 0.72 : 1.0;
      for (var x2 = 0; x2 < W; x2++, i2++, p += 4) {
        var v = Math.min(1, buf[i2]) * scan;
        v = v + (BAYER[y2 & 7][x2 & 7] - 0.5) * (1 / 3);
        var lv = v > 0.72 ? 3 : v > 0.42 ? 2 : v > 0.14 ? 1 : 0;
        d[p] = R[lv]; d[p + 1] = G[lv]; d[p + 2] = B[lv]; d[p + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  if (reduced) {
    for (var f = 0; f < 40; f++) step();
  } else {
    (function loop() { step(); requestAnimationFrame(loop); })();
  }

  /* ---- optional tones ---------------------------------------------- */

  var btn = document.getElementById("tone");
  var live = null;

  btn.addEventListener("click", function () {
    if (window.DA.playing("scope")) { window.DA.stop(); return; }
    window.DA.play("scope", function (ctx2, out) {
      var bus = ctx2.createGain(); bus.gain.value = 0.22; bus.connect(out);
      var a = ctx2.createOscillator(), b = ctx2.createOscillator();
      a.type = b.type = "sine";
      var ga = ctx2.createGain(), gb = ctx2.createGain();
      ga.gain.value = gb.gain.value = 0.4;
      a.connect(ga); ga.connect(bus);
      b.connect(gb); gb.connect(bus);
      a.start(); b.start();
      live = { a: a, b: b };
      window.__scopeTone = function () {
        if (!live) return;
        var base = 110;
        live.a.frequency.setTargetAtTime(base * nx, ctx2.currentTime, 0.05);
        live.b.frequency.setTargetAtTime(base * ny, ctx2.currentTime, 0.05);
      };
      window.__scopeTone();
      return function () {
        live = null; window.__scopeTone = null;
        try { a.stop(); b.stop(); } catch (e) {}
        bus.disconnect();
      };
    });
  });

  document.addEventListener("da:source", function (e) {
    btn.setAttribute("aria-pressed", e.detail.id === "scope" ? "true" : "false");
  });

  paint();
})();
</script>
</body>
</html>
